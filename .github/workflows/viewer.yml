name: viewer

# Builds the viewer's JSON from the committed Parquet + live observations + R2
# webcam listing, then deploys the static site to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "data/forecasts/**"
      - "data/observations/**"
      - "viewer/**"
      - "powwx/**"
      - "scripts/build_viewer_data.py"
      - "scripts/build_verification.py"
  schedule:
    - cron: "30 0,6,12,18 * * *"   # ~30 min after each forecast-logger run
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build viewer data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: python scripts/build_viewer_data.py

      - name: Build verification metrics
        run: python scripts/build_verification.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
