name: viewer

# Builds the viewer's JSON from the committed Parquet + live observations + R2
# webcam listing, then deploys the static site to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "data/forecasts/**"
      - "data/observations/**"
      - "viewer/**"
      - "powwx/**"
      - "scripts/build_viewer_data.py"
      - "scripts/build_verification.py"
      - "scripts/build_history.py"
      - "data/reanalysis/**"
      - "config/history.yaml"
  schedule:
    - cron: "30 0,6,12,18 * * *"   # ~30 min after each forecast-logger run
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      verify_outcome: ${{ steps.verify.outcome }}
      history_outcome: ${{ steps.history.outcome }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps -e .

      - name: Build viewer data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: python scripts/build_viewer_data.py

      # Verification is optional for the page: if it fails, still deploy the
      # forecasts/observations (the panel says it's unavailable) and fail the run below.
      - name: Build verification metrics
        id: verify
        continue-on-error: true
        run: python scripts/build_verification.py

      # "Season in context" is optional too, and runs after verification so the
      # forecast days can use the fresh blend.json.
      - name: Build season history
        id: history
        continue-on-error: true
        run: python scripts/build_history.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Surface a failed verification or history step as a failed run (and its
  # email) once the rest of the page has deployed.
  verification-status:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.verify_outcome == 'failure' || needs.build.outputs.history_outcome == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.outputs.verify_outcome }}" = "failure" ]; then
            echo "::error::Verification build failed; the page deployed without verification.json."
          fi
          if [ "${{ needs.build.outputs.history_outcome }}" = "failure" ]; then
            echo "::error::History build failed; the page deployed without history.json."
          fi
          exit 1
