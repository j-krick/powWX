name: forecast-logger

# Append-only multi-model forecast log. Runs every 6h and commits the new
# Parquet file(s) back to the repo. Data not recoverable retroactively — keep
# this green.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 00/06/12/18 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write             # to start the page rebuild below

concurrency:
  group: forecast-data       # shared with backfill to avoid push races
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps -e .

      - name: Run forecast logger
        run: python scripts/run_forecast_logger.py

      # Runs after the deterministic log and may fail without touching it.
      - name: Run ensemble logger
        continue-on-error: true
        run: python scripts/run_ensemble_logger.py

      - name: Commit new forecast data
        id: commit
        run: |
          git config user.name  "powwx-bot"
          git config user.email "actions@github.com"
          git add data/forecasts
          if [ -d data/ensembles ]; then git add data/ensembles; fi
          if git diff --cached --quiet; then
            echo "No new forecast data to commit."
          else
            git commit -m "forecast log: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't start other workflows, and GitHub
      # skips many scheduled viewer runs, so ask for the rebuild directly.
      - name: Rebuild the page with the new run
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run viewer.yml --ref main
