# Open-Meteo deterministic models logged for verification.
#
# Identifiers VERIFIED resolving on https://api.open-meteo.com/v1/forecast for
# Shames (54.49837 N, -128.96421 W) on 2026-05-29. Re-verify periodically:
# Open-Meteo occasionally renames model ids. A quick check is in
# scripts/verify_models.py.

api:
  forecast_url: https://api.open-meteo.com/v1/forecast
  previous_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  timezone: GMT                # always log in UTC
  forecast_days: 16            # request max horizon; short-range models null out beyond
                               # their horizon and those nulls are dropped.

# Variables to log (Open-Meteo hourly names). Not every model serves every
# variable; missing combos come back null and are dropped on parse.
variables:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - snowfall
  - snow_depth
  - wind_speed_10m
  - wind_gusts_10m
  - wind_direction_10m
  - freezing_level_height   # only GFS + ICON populate this on Open-Meteo; the
                            # GEM/ECMWF models return null and are dropped on parse.

# run_meta: the Open-Meteo data domain whose meta.json names the model's newest
# run; the loggers store it as run_init. Checked 2026-10-19 against the Single
# Runs API: the run each names is the one the forecast API serves. (GEM global
# and regional moved to the 15 km / 10 km domains; cmc_gem_gdps/rdps are frozen.)
models:
  - id: gem_hrdps_continental
    run_meta: cmc_gem_hrdps
    label: GEM HRDPS
    resolution_km: 2.5
    horizon_days: 2
  - id: gem_regional
    run_meta: cmc_gem_rdps_10km
    label: GEM RDPS
    resolution_km: 10
    horizon_days: 3.5
  - id: gem_global
    run_meta: cmc_gem_gdps_15km
    label: GEM GDPS
    resolution_km: 15
    horizon_days: 10
  - id: ecmwf_ifs025
    run_meta: ecmwf_ifs025
    label: ECMWF IFS
    resolution_km: 9
    horizon_days: 10
  - id: ecmwf_aifs025_single
    run_meta: ecmwf_aifs025_single
    label: ECMWF AIFS
    resolution_km: 28
    horizon_days: 10
  - id: gfs_seamless
    run_meta: ncep_gfs013
    label: GFS (Seamless)
    resolution_km: 11
    horizon_days: 16
  - id: icon_global
    run_meta: dwd_icon
    label: ICON Global
    resolution_km: 11
    horizon_days: 7.5

# Ensembles: logged now (a live snapshot can't be fetched later), verified later.
# Written to data/ensembles/, NOT data/forecasts/, so the members never enter the
# deterministic leaderboard or the blend. Each member is logged as its own model
# id, <id>_memberNN (member00 = control). Verified on the Ensemble API for
# Shames on 2026-10-16: 21 members, 16 days, no freezing_level_height.
ensembles:
  url: https://ensemble-api.open-meteo.com/v1/ensemble
  forecast_days: 16
  variables:
    - temperature_2m
    - precipitation
    - snowfall
  models:
    - id: gem_global_ensemble
      run_meta: cmc_gem_geps
      label: GEPS (GEM ensemble)
      members: 21

# --- Deferred / not applicable (documented so we don't relitigate) ---
# HRRR: CONUS-only on Open-Meteo -> does NOT cover Shames (54.5 N). gfs_seamless
#       runs alone here; no high-res ride-along at our latitude.
# HRDPS 1 km West: not on Open-Meteo (needs ECCC GRIB2 pipeline). Future, not v1.
