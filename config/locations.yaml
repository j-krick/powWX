# Observation points (the "actuals") and the coordinates we log forecasts for.
# Both elevations matter: verification is done per elevation.
locations:
  - id: pow_o_meter
    name: POW-O-METER (top of hill)
    role: top
    latitude: 54.49819     # 54°29'53.5"N (current site, shames_top_b)
    longitude: -128.96317  # 128°57'47.4"W
    elevation_m: 1150
    # Station sites and moves: powOmeter's v1/sites.json is the record (review
    # F14), not this file. The station moved ~70 m on 2026-09-26 from
    # shames_top_a (until 18:15Z) to shames_top_b (from 20:45Z); powOmeter's
    # data carry site_id, so snow depth is split by site from there.
    # Temperature/RH are fine to pool: same elevation, same model grid cell
    # (checked 2026-09-29: Open-Meteo output identical to <=0.1 degC).
    # https://mount-remo-backcountry-society.github.io/powOmeter/v1/sites.json
    # Variables this station actually observes (used in Phase 2 verification).
    # Wind sensor may be added later -> unlocks top-of-hill wind verification.
    observed: [temperature_2m, snow_depth, relative_humidity_2m]
    source: powometer_v1   # powOmeter's published v1 files (MRBS, CC BY 4.0)

  - id: station_58
    name: "DriveBC / Avalanche Canada station #58 (bottom of hill)"   # quoted: " #" starts a YAML comment
    role: bottom
    latitude: 54.484970
    longitude: -128.955860
    elevation_m: 740
    observed: [temperature_2m, precipitation, snow_depth, wind_speed_10m, wind_direction_10m]
    source: avalanche_canada   # queryable weather-station API, station id 58
